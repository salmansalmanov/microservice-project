databaseChangeLog:
  - changeSet:
      id: 1.0.0-create-users-table
      author: salmansalmanov
      changes:
        - createTable:
            tableName: users
            columns:
              - column:
                  name: id
                  type: BIGINT
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: first_name
                  type: VARCHAR
                  constraints:
                    nullable: false
              - column:
                  name: last_name
                  type: VARCHAR
                  constraints:
                    nullable: false
              - column:
                  name: email
                  type: VARCHAR
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: phone_number
                  type: VARCHAR
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: street
                  type: VARCHAR
                  constraints:
                    nullable: false
              - column:
                  name: city
                  type: VARCHAR
                  constraints:
                    nullable: false
              - column:
                  name: zip_code
                  type: VARCHAR
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: VARCHAR
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: deleted_at
                  type: TIMESTAMP WITH TIME ZONE